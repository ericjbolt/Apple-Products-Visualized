name: Weekly product update

# Runs every Tuesday at 3:00 p.m. Pacific time.
# GitHub schedules use UTC, and 3:00 p.m. Pacific is 22:00 UTC in daylight time
# (March to November) and 23:00 UTC in standard time. Both times are scheduled,
# and the "pacific-time" job lets only the one that matches today's clock through.
on:
  schedule:
    - cron: "0 22 * * 2"   # 3:00 p.m. Pacific daylight time
    - cron: "0 23 * * 2"   # 3:00 p.m. Pacific standard time
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  pacific-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Los_Angeles date +%z)   # -0700 in daylight time, -0800 in standard time
          if [ "$TRIGGER" != "schedule" ]; then
            run=true
          elif [ "$offset" = "-0700" ] && [ "$SCHEDULE" = "0 22 * * 2" ]; then
            run=true
          elif [ "$offset" = "-0800" ] && [ "$SCHEDULE" = "0 23 * * 2" ]; then
            run=true
          else
            run=false
          fi
          echo "Pacific offset $offset, schedule '$SCHEDULE', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: pacific-time
    if: needs.pacific-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check Wikipedia for new releases
        continue-on-error: true
        run: python scripts/fetch_all_time.py

      - name: Sync the current lineup with apple.com
        continue-on-error: true
        run: python scripts/fetch_current.py

      - name: Download product photos from Wikimedia Commons
        continue-on-error: true
        run: python scripts/fetch_images.py

      - name: Render images
        run: python scripts/render.py

      - name: Open a pull request with any changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/weekly-update
          delete-branch: true
          commit-message: "Weekly product update"
          title: "Weekly product update"
          body: |
            Automated weekly refresh from apple.com and Wikipedia.

            Before merging, open `data/products.json` and check any product marked
            `"needs_review": true` (name, category, and date). Remove that flag once checked.
            The job summary on the Actions tab lists every change. New photos and their
            credits are in `assets/photos/` and `CREDITS.md`.
